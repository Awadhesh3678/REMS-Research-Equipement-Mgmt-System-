<style>
  /* 
   * FILE: css.html
   * FUNCTIONALITY: Contains the extensive CSS styling rules for status.html.
   * Defines the animations, buttons, overlays, loading skeletons, and the dynamic layout 
   * for the complex Booking operations.
   */
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

  /* ============================================================
     DESIGN TOKENS
  ============================================================ */
  :root {
    --primary:        #0f1f36;
    --primary-mid:    #1a3254;
    --primary-light:  #1e3d6b;
    --accent:         #00c4b4;
    --accent-dim:     rgba(0, 196, 180, 0.15);
    --accent-glow:    rgba(0, 196, 180, 0.35);
    --accent-deep:    #009e90;

    --bg:             #eef2f7;
    --surface:        #ffffff;
    --surface-alt:    #f7fafc;
    --border:         #dde4ee;
    --border-focus:   var(--accent);

    --text-h:         #0d1b2a;
    --text-b:         #2d3a4a;
    --text-muted:     #7a8fa6;
    --text-inv:       #ffffff;

    --s-available:    #00c4b4;
    --s-available-bg: rgba(0, 196, 180, 0.12);
    --s-using:        #e84545;
    --s-using-bg:     rgba(232, 69, 69, 0.12);
    --s-waitlist:     #f59e0b;
    --s-waitlist-bg:  rgba(245, 158, 11, 0.12);

    --radius-card:    20px;
    --radius-btn:     14px;
    --radius-input:   12px;
    --shadow-card:    0 4px 24px rgba(15, 31, 54, 0.07);
    --shadow-btn:     0 6px 20px rgba(0, 196, 180, 0.35);
    --shadow-btn-danger: 0 6px 20px rgba(232, 69, 69, 0.3);
    --transition:     all 0.22s cubic-bezier(0.4, 0, 0.2, 1);

    /* Skeleton shimmer */
    --shimmer-base:   #e8edf4;
    --shimmer-high:   #f5f8fc;
  }

  /* ============================================================
     RESET & BASE
  ============================================================ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-b);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================================================
     CONTAINER
  ============================================================ */
  .container {
    background: var(--bg);
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    padding-bottom: 48px;
    box-shadow: 0 0 60px rgba(15, 31, 54, 0.1);
  }

  /* ============================================================
     HEADER
  ============================================================ */
  .header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    color: var(--text-inv);
    padding: 22px 20px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-radius: 0 0 28px 28px;
    margin-bottom: -14px;
    position: relative;
    z-index: 10;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,196,180,0.18) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Top progress bar — sits at the very top of the header */
  .progress-bar-track {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(255,255,255,0.1);
    overflow: hidden;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .progress-bar-track.active { opacity: 1; }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #2563eb, var(--accent));
    background-size: 200% 100%;
    animation: progress-slide 1.4s ease-in-out infinite;
    border-radius: 0 2px 2px 0;
    width: 60%;
  }
  @keyframes progress-slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(260%); }
  }

  .header-back {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
    color: white;
    width: 42px; height: 42px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: var(--transition);
    backdrop-filter: blur(4px);
  }
  .header-back:hover  { background: rgba(255,255,255,0.22); }
  .header-back:active { transform: scale(0.94); }

  .header-title-container { text-align: center; flex-grow: 1; padding: 0 12px; }
  .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 2.5px; line-height: 1.1; color: #fff; }
  .header-sub { font-size: 10.5px; color: rgba(163,201,226,0.85); font-weight: 500; letter-spacing: 0.5px; margin-top: 3px; }

  .header-avatar {
    width: 42px; height: 42px;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    flex-shrink: 0;
    transition: var(--transition);
    cursor: pointer;
  }
  .header-avatar:hover { background: rgba(255,255,255,0.25); }

  /* ============================================================
     SCREEN TRANSITION — fade + lift
  ============================================================ */
  .screen-panel {
    animation: screen-enter 0.32s cubic-bezier(0.4, 0, 0.2, 1) both;
  }
  @keyframes screen-enter {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     CARDS
  ============================================================ */
  .card {
    background: var(--surface);
    border-radius: var(--radius-card);
    padding: 22px 20px;
    margin: 18px 16px 0;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(220, 230, 245, 0.6);
    position: relative;
    overflow: hidden;
  }

  .card-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--text-muted);
    margin-bottom: 14px; display: flex; align-items: center; gap: 6px;
  }
  .card-label svg { color: var(--accent); }
  .card-title { font-size: 17px; font-weight: 700; color: var(--text-h); margin-bottom: 4px; }

  /* ============================================================
     STATUS CARD
  ============================================================ */
  .status-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
    border: none;
  }
  .status-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .status-left { flex: 1; }
  .status-eq-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .status-eq-meta { font-size: 12px; color: rgba(163,201,226,0.8); display: flex; align-items: center; gap: 6px; }
  .status-eq-meta svg { flex-shrink: 0; }
  .status-pill-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

  .status-badge {
    position: relative; display: inline-flex; align-items: center; gap: 6px;
    background: var(--s-available-bg); color: var(--s-available);
    font-weight: 700; font-size: 12px; padding: 7px 14px; border-radius: 50px;
    border: 1.5px solid rgba(0, 196, 180, 0.4); letter-spacing: 0.8px;
    text-transform: uppercase; white-space: nowrap;
  }
  .status-badge.using    { background: var(--s-using-bg);    color: var(--s-using);    border-color: rgba(232,69,69,0.4); }
  .status-badge.waitlist { background: var(--s-waitlist-bg); color: var(--s-waitlist); border-color: rgba(245,158,11,0.4); }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex-shrink: 0;
    animation: dot-pulse 2s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.65); }
  }

  /* ============================================================
     SKELETON / SHIMMER  — the NEW loading state
  ============================================================ */

  /* shimmer animation sweep */
  @keyframes shimmer {
    0%   { background-position: -400px 0; }
    100% { background-position:  400px 0; }
  }

  /* base skeleton block */
  .sk {
    border-radius: 8px;
    background: linear-gradient(90deg,
      var(--shimmer-base) 25%,
      var(--shimmer-high) 50%,
      var(--shimmer-base) 75%
    );
    background-size: 800px 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    display: block;
  }
  .sk-dark {
    background: linear-gradient(90deg,
      rgba(255,255,255,0.08) 25%,
      rgba(255,255,255,0.18) 50%,
      rgba(255,255,255,0.08) 75%
    );
    background-size: 800px 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    display: block;
    border-radius: 8px;
  }

  /* Skeleton layout for the Status Card */
  .sk-status-card {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-mid) 100%);
    border: none;
  }

  /* ─── Skeleton screen that mirrors screen-landing ─── */

  .sk-status-inner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .sk-status-left { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .sk-badge-wrap  { flex-shrink: 0; }

  /* profile chip skeleton */
  .sk-profile-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .sk-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .sk-chip-icon { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; }
  .sk-chip-text { flex: 1; display: flex; flex-direction: column; gap: 6px; }

  /* input skeleton */
  .sk-input { height: 52px; border-radius: var(--radius-input); }

  /* button skeleton */
  .sk-btn { height: 52px; border-radius: var(--radius-btn); }

  /* Generic heights */
  .sk-h8  { height: 8px;  }
  .sk-h10 { height: 10px; }
  .sk-h12 { height: 12px; }
  .sk-h14 { height: 14px; }
  .sk-h18 { height: 18px; }
  .sk-h22 { height: 22px; }
  .sk-h32 { height: 32px; }

  /* width helpers */
  .sk-w40  { width: 40%; }
  .sk-w55  { width: 55%; }
  .sk-w70  { width: 70%; }
  .sk-w80  { width: 80%; }
  .sk-w100 { width: 100%; }
  .sk-w28  { width: 28px; }

  /* ============================================================
     LOADING STEP INDICATOR  (inside action overlay)
  ============================================================ */
  .loading-step-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }

  /* Orbital ring spinner — double ring */
  .orbit-ring {
    width: 60px; height: 60px; position: relative;
  }
  .orbit-ring::before, .orbit-ring::after {
    content: ''; position: absolute; border-radius: 50%;
  }
  .orbit-ring::before {
    inset: 0;
    border: 3px solid rgba(255,255,255,0.08);
  }
  .orbit-ring::after {
    inset: 0;
    border: 3px solid transparent;
    border-top-color: var(--accent);
    border-right-color: rgba(0,196,180,0.3);
    animation: spin 0.85s cubic-bezier(0.4,0,0.6,1) infinite;
  }
  /* inner ring */
  .orbit-ring-inner {
    position: absolute;
    inset: 10px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-bottom-color: rgba(37,99,235,0.6);
    animation: spin 1.3s cubic-bezier(0.4,0,0.6,1) infinite reverse;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-step-label {
    font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.88);
    letter-spacing: 0.3px; text-align: center;
  }
  .loading-step-sub {
    font-size: 12px; color: rgba(255,255,255,0.45); font-weight: 500;
    margin-top: -14px; text-align: center;
  }

  /* Dot progress row  ●  ●  ●  */
  .dot-row {
    display: flex; gap: 7px; align-items: center;
  }
  .dot-row span {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .dot-row span:nth-child(2) { animation-delay: 0.2s; }
  .dot-row span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(1);    background: rgba(255,255,255,0.25); }
    40%           { transform: scale(1.5);   background: var(--accent); }
  }

  /* ============================================================
     ACTION OVERLAY  (replaces old .overlay)
  ============================================================ */
  .action-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(8, 16, 28, 0.82);
    backdrop-filter: blur(8px) saturate(0.7);
    -webkit-backdrop-filter: blur(8px) saturate(0.7);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 999; gap: 0;
    /* No animation here — applied via .is-open so it re-fires every show */
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  /* Trigger class — applied by JS when showing overlay */
  .action-overlay.is-open {
    opacity: 1;
    pointer-events: all;
  }
  /* card inside overlay */
  .overlay-card {
    background: rgba(15,31,54,0.9);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 36px 40px;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    min-width: 220px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    transform: scale(0.88) translateY(12px);
    transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1), opacity 0.2s ease;
    opacity: 0;
  }
  .action-overlay.is-open .overlay-card {
    transform: scale(1) translateY(0);
    opacity: 1;
  }

  /* ============================================================
     INLINE BUTTON SPINNER
  ============================================================ */
  .btn-spinner {
    width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.3);  /* integer px for cross-browser consistency */
    border-top-color: #fff;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
    display: inline-block;                    /* safe default if flex context missing */
  }
  /* secondary button variant (dark text) */
  .btn-spinner.dark {
    border-color: rgba(45,58,74,0.22);
    border-top-color: var(--text-h);
  }

  /* ============================================================
     EQUIPMENT PROFILE CARD
  ============================================================ */
  .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 2; }
  .profile-chip {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-alt); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
  }
  .profile-chip-icon {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--accent-dim); display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0;
  }
  .profile-chip-text { min-width: 0; }
  .profile-chip-label { font-size: 10px; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 2px; text-transform: uppercase; }
  .profile-chip-value { font-size: 13px; font-weight: 700; color: var(--text-h); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .profile-chip.full { grid-column: 1 / -1; }

  /* ============================================================
     QUEUE INFO CARD
  ============================================================ */
  .queue-card { background: linear-gradient(135deg, #fff8eb, #fffbf2); border-color: rgba(245,158,11,0.3); }
  .queue-label { color: var(--s-waitlist); }
  .queue-count-row { display: flex; align-items: center; gap: 12px; }
  .queue-number { font-size: 36px; font-weight: 800; color: var(--s-waitlist); line-height: 1; }
  .queue-desc   { font-size: 13px; color: var(--text-muted); line-height: 1.4; }

  /* ============================================================
     INPUT GROUP
  ============================================================ */
  .input-group { position: relative; margin-bottom: 16px; }
  .input-label { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px; display: block; }
  .input-group input, .input-group select {
    width: 100%; padding: 15px 48px 15px 16px;
    border: 1.5px solid var(--border); border-radius: var(--radius-input);
    font-size: 15px; font-family: 'Inter', sans-serif; font-weight: 500;
    outline: none; background: var(--surface-alt); color: var(--text-h);
    transition: var(--transition); appearance: none; -webkit-appearance: none;
  }
  .input-group select { padding-right: 44px; cursor: pointer; }
  .input-group input:focus, .input-group select:focus {
    border-color: var(--border-focus); background: #fff;
    box-shadow: 0 0 0 3px rgba(0,196,180,0.12);
  }
  .input-group input::placeholder { color: #b0bec9; }
  .input-icon  { position: absolute; right: 14px; bottom: 15px; color: var(--text-muted); pointer-events: none; }
  .select-arrow { position: absolute; right: 14px; bottom: 18px; color: var(--text-muted); pointer-events: none; }

  /* ============================================================
     BUTTONS
  ============================================================ */
  .btn {
    width: 100%; padding: 15px 20px;
    border: none; border-radius: var(--radius-btn);
    font-size: 15px; font-family: 'Inter', sans-serif; font-weight: 700;
    cursor: pointer; display: flex; justify-content: center; align-items: center;
    gap: 8px; letter-spacing: 0.3px; transition: var(--transition);
  }
  .btn:active   { transform: scale(0.97); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

  .btn-primary  { background: linear-gradient(135deg, var(--accent) 0%, #2563eb 100%); color: #fff; box-shadow: var(--shadow-btn); }
  .btn-primary:not(:disabled):hover { filter: brightness(1.07); box-shadow: 0 8px 28px rgba(0,196,180,0.45); }

  .btn-danger   { background: linear-gradient(135deg, var(--s-using) 0%, #c0392b 100%); color: #fff; box-shadow: var(--shadow-btn-danger); }
  .btn-danger:not(:disabled):hover { filter: brightness(1.07); }

  .btn-secondary { background: var(--surface-alt); color: var(--text-h); border: 1.5px solid var(--border); }
  .btn-secondary:not(:disabled):hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  .btn-warning  { background: linear-gradient(135deg, var(--s-waitlist) 0%, #d97706 100%); color: #fff; box-shadow: 0 6px 20px rgba(245,158,11,0.3); }
  .btn-navy     { background: var(--primary); color: #fff; box-shadow: 0 6px 20px rgba(15,31,54,0.25); }

  /* ============================================================
     ACTIVE SESSION CARD
  ============================================================ */
  .timer-block { text-align: center; padding: 24px 0 20px; }
  .timer-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 8px; }
  .timer-value { font-size: 48px; font-weight: 800; color: var(--text-h); letter-spacing: -1px; line-height: 1.1; }
  .timer-suffix { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-top: 4px; }

  .active-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(0,196,180,0.12); color: var(--accent-deep);
    border: 1.5px solid rgba(0,196,180,0.3); padding: 5px 12px;
    border-radius: 50px; font-size: 11px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 8px;
  }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }

  .extend-label { font-size: 13px; font-weight: 600; color: var(--text-b); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  /* ============================================================
     BOOKING SCREEN
  ============================================================ */
  .welcome-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
  .welcome-hi  { font-size: 13px; color: var(--text-muted); font-weight: 500; margin-bottom: 2px; }
  .welcome-name { font-size: 22px; font-weight: 800; color: var(--text-h); line-height: 1.15; }
  .welcome-dept { font-size: 12px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }
  .welcome-icon { width: 48px; height: 48px; border-radius: 14px; background: var(--accent-dim); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }

  .duration-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .duration-pill {
    padding: 9px 16px; border: 1.5px solid var(--border); border-radius: 50px;
    font-size: 13px; font-weight: 600; color: var(--text-muted); background: var(--surface-alt);
    cursor: pointer; transition: var(--transition); white-space: nowrap;
  }
  .duration-pill:hover   { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .duration-pill.selected { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 4px 12px rgba(0,196,180,0.3); }

  .warning-banner {
    display: flex; gap: 12px; background: #fff8eb;
    border: 1px solid rgba(245,158,11,0.35); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 16px;
  }
  .warning-banner-icon { width: 32px; height: 32px; background: rgba(245,158,11,0.15); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--s-waitlist); flex-shrink: 0; }
  .warning-banner-text { font-size: 12.5px; color: #856404; line-height: 1.5; }
  .warning-banner-text strong { display: block; margin-bottom: 2px; }

  /* ============================================================
     WITHDRAW SCREEN
  ============================================================ */
  .queue-position-display { display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 8px; }
  .queue-pos-number { font-size: 64px; font-weight: 800; color: var(--s-waitlist); line-height: 1; }
  .queue-pos-label  { font-size: 13px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.3px; }
