<!DOCTYPE html>
<!--
  FILE: profile.html
  FUNCTIONALITY: The structural HTML layout and specific CSS for the User Profile screen.
  Includes the login overlay, user identity badge, and tabbed layout (Active Bookings/History).
-->
<html lang="en">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>REMS - User Profile</title>
  
  <?!= include('css'); ?>
  
  <style>
    /* Profile Specific Overrides */
    body {
      background: #0f172a; /* Deep navy/black background */
      color: #f8fafc;
      overflow-x: hidden;
      min-height: 100vh;
      display: block; /* Override default centered flex */
    }

    /* Animated Blobs for background */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.5;
      animation: float 20s infinite alternate;
    }
    .blob-1 { top: -100px; left: -100px; width: 300px; height: 300px; background: rgba(79, 70, 229, 0.4); }
    .blob-2 { bottom: -100px; right: -100px; width: 400px; height: 400px; background: rgba(0, 196, 180, 0.3); }
    @keyframes float {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }

    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .profile-header {
      padding: 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .profile-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .header-back {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .header-back:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .icon-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: white;
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.2); }

    .user-section {
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar-large {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #00c4b4);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 1rem;
      box-shadow: 0 8px 24px rgba(0, 196, 180, 0.3);
      border: 2px solid rgba(255,255,255,0.2);
    }
    
    .avatar-large svg {
      width: 40px; height: 40px;
      color: white;
    }

    .user-name { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
    .user-id { font-size: 0.9rem; color: #94a3b8; margin-bottom: 1rem; }

    .logout-btn {
      background: rgba(232, 69, 69, 0.15);
      color: #ff6b6b;
      border: 1px solid rgba(232, 69, 69, 0.3);
      padding: 0.5rem 1.25rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .logout-btn:hover {
      background: rgba(232, 69, 69, 0.25);
    }

    .tabs {
      display: flex;
      padding: 0 1.5rem;
      gap: 1rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .tab {
      padding: 0.75rem 0;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      position: relative;
      transition: color 0.2s ease;
    }
    .tab.active {
      color: white;
    }
    .tab.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background: #00c4b4;
      border-radius: 2px 2px 0 0;
      box-shadow: 0 -2px 10px rgba(0, 196, 180, 0.5);
    }

    .content-area {
      padding: 0 1.5rem 2rem 1.5rem;
    }

    .list-section {
      display: none;
      flex-direction: column;
      gap: 1rem;
    }
    .list-section.active {
      display: flex;
    }

    .card {
      padding: 1.25rem;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-decoration: none;
      color: white;
      transition: transform 0.2s ease;
    }
    .card:active { transform: scale(0.98); }
    
    .card.history-card {
      background: rgba(30, 41, 59, 0.4); /* darker/desaturated */
      border: 1px solid rgba(255,255,255,0.05);
    }
    .card.history-card .card-title { color: #cbd5e1; }
    .card.history-card .detail-text { color: #64748b; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 0.25rem; }
    .card-subtitle { font-size: 0.8rem; color: #94a3b8; }

    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .status-active { background: rgba(0, 196, 180, 0.15); color: #00c4b4; border: 1px solid rgba(0, 196, 180, 0.3); }
    .status-completed { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .detail-text { color: #94a3b8; }
    .detail-icon { color: #4f46e5; width: 16px; height: 16px; }

    /* Login overlay if no empId */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: #0f172a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .login-box {
      width: 100%;
      max-width: 320px;
      padding: 2rem;
      border-radius: 20px;
    }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
    }
    .login-input:focus { border-color: #00c4b4; }
    .login-submit {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #00c4b4);
      color: white;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

  </style>
</head>
<body>

  <!-- Background Effects -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay hidden">
    <div class="login-box glass">
      <div class="avatar-large" style="margin: 0 auto 1.5rem auto;">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11a4 4 0 100-8 4 4 0 000 8zM20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path></svg>
      </div>
      <h2 style="margin-bottom: 0.5rem; font-size: 1.25rem;">Identify Yourself</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem;">Enter your Employee ID to view your profile.</p>
      
      <input type="text" id="loginEmpId" class="login-input" placeholder="e.g. EMP-1234">
      <button class="login-submit" onclick="submitLogin()">Access Profile</button>
    </div>
  </div>

  <!-- Main Profile Screen -->
  <div id="mainProfile" class="hidden">
    
    <header class="profile-header glass">
      <button class="header-back" onclick="goBack()" aria-label="Go back">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
        </svg>
      </button>
      <h1>REMS Profile</h1>
      <div style="width: 40px;"></div> <!-- Spacer for flex centering -->
    </header>

    <div class="user-section">
      <div class="avatar-large">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
        </svg>
      </div>
      <div id="profName" class="user-name">Loading...</div>
      <div id="profId" class="user-id">EMP-XXXX</div>
      
      <button class="logout-btn" onclick="logoutUser()">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        Sign Out
      </button>
    </div>

    <div class="tabs">
      <div class="tab active" id="tab-active" onclick="switchTab('active')">Active Bookings (<span id="activeCount">0</span>)</div>
      <div class="tab" id="tab-history" onclick="switchTab('history')">History</div>
    </div>

    <div class="content-area">
      <!-- Loader -->
      <div id="profileLoader" style="text-align: center; padding: 2rem; color: #94a3b8;">
        Fetching your data...
      </div>

      <!-- Active Bookings List -->
      <div id="list-active" class="list-section active">
        <!-- populated by JS -->
      </div>

      <!-- History List -->
      <div id="list-history" class="list-section">
        <!-- populated by JS -->
      </div>
    </div>

  </div>

  <script>
    const GLOBAL_WEB_APP_URL = "<?= webAppUrl ?>";
    const FROM_EQUIPMENT_ID = "<?= fromId ?>";

    function goBack() {
      if (FROM_EQUIPMENT_ID) {
        window.open(GLOBAL_WEB_APP_URL + "?equipment_id=" + encodeURIComponent(FROM_EQUIPMENT_ID), "_top");
      } else {
        window.open(GLOBAL_WEB_APP_URL, "_top");
      }
    }
  </script>
  <?!= include('profile_javascript'); ?>

</body>
</html>
